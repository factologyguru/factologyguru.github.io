<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>The Factology Guru™ — 100 Facts. 10,000 Words. Endless Wonder.</title>
<meta name="description" content="The Factology Guru™ — 100 carefully researched facts about the most fascinating subjects on Earth. Weird, Wild & Wonderful.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #0f1f3d;
    --navy-light: #162848;
    --gold: #D4AF37;
    --gold-light: #F0D060;
    --gold-dim: #8a7020;
    --white: #f5f0e8;
    --white-dim: #a89f8c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(212,175,55,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 60%, rgba(212,175,55,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 70%, rgba(212,175,55,0.25) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 20%, rgba(212,175,55,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 85%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 45%, rgba(212,175,55,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 15% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 48px 24px 36px;
    border-bottom: 1px solid rgba(212,175,55,0.2);
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 8px;
  }

  .logo-img {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    opacity: 0.95;
  }

  .brand-text {
    text-align: left;
  }

  .brand-the {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 40px rgba(212,175,55,0.3);
  }

  .brand-name sup {
    font-size: 14px;
    vertical-align: super;
    color: var(--gold-dim);
  }

  .tagline {
    font-family: 'Crimson Pro', serif;
    font-size: 17px;
    color: var(--white-dim);
    letter-spacing: 2px;
    font-style: italic;
    margin-top: 6px;
  }

  /* DIVIDER */
  .gold-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto;
  }

  /* MAIN */
  main {
    position: relative;
    z-index: 5;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* SPOTLIGHT */
  .spotlight-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-align: center;
    padding: 40px 0 28px;
    text-transform: uppercase;
  }

  .spotlight {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 48px;
    align-items: center;
    background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 4px;
    padding: 40px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .spotlight::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .spotlight-cover {
    position: relative;
  }

  .spotlight-cover img {
    width: 100%;
    border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.1);
    display: block;
    transition: transform 0.4s ease;
  }

  .spotlight-cover:hover img {
    transform: translateY(-4px);
  }

  .new-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: var(--gold);
    color: var(--navy);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 2px;
  }

  .spotlight-info {
    padding: 8px 0;
  }

  .spotlight-category {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .spotlight-title {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .spotlight-subtitle {
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--white-dim);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .spotlight-desc {
    font-size: 17px;
    line-height: 1.7;
    color: var(--white);
    opacity: 0.85;
    margin-bottom: 32px;
  }

  .btn-amazon {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 32px;
    text-decoration: none;
    border-radius: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(212,175,55,0.3);
  }

  .btn-amazon:hover {
    background: var(--gold-light);
    box-shadow: 0 6px 30px rgba(212,175,55,0.5);
    transform: translateY(-1px);
  }

  /* GRID SECTION */
  .grid-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-dim);
    text-align: center;
    padding: 48px 0 28px;
    text-transform: uppercase;
  }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
  }

  .book-card {
    background: var(--navy-mid);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 3px;
    overflow: hidden;
    text-decoration: none;
    transition: all 0.3s ease;
    display: block;
  }

  .book-card:hover {
    border-color: rgba(212,175,55,0.5);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(212,175,55,0.1);
  }

  .book-card img {
    width: 100%;
    display: block;
  }

  .book-card-info {
    padding: 12px;
  }

  .book-card-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--gold);
    line-height: 1.4;
  }

  .book-card-cat {
    font-size: 11px;
    color: var(--white-dim);
    margin-top: 4px;
    font-style: italic;
  }

  /* EMPTY STATE */
  .empty-grid {
    text-align: center;
    padding: 48px;
    border: 1px dashed rgba(212,175,55,0.2);
    border-radius: 4px;
    color: var(--white-dim);
    font-style: italic;
    font-size: 16px;
  }

  /* FOOTER */
  footer {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 32px 24px;
    border-top: 1px solid rgba(212,175,55,0.15);
  }

  .footer-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold-dim);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .footer-desc {
    font-size: 14px;
    color: var(--white-dim);
    opacity: 0.6;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header { animation: fadeUp 0.8s ease forwards; }
  .spotlight { animation: fadeUp 0.8s 0.2s ease both; }
  .books-grid { animation: fadeUp 0.8s 0.4s ease both; }

  /* RESPONSIVE */
  @media (max-width: 680px) {
    .spotlight {
      grid-template-columns: 1fr;
      padding: 24px;
      gap: 24px;
    }
    .spotlight-cover { max-width: 220px; margin: 0 auto; }
    .brand-name { font-size: 26px; }
    .spotlight-title { font-size: 20px; }
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <!-- Replace src with your actual hosted logo URL -->
    <img class="logo-img" src="logo.png" alt="Factology Guru Logo">
    <div class="brand-text">
      <div class="brand-the">The</div>
      <div class="brand-name">Factology Guru<sup>™</sup></div>
    </div>
  </div>
  <div class="gold-rule" style="margin-top:16px;margin-bottom:12px;"></div>
  <div class="tagline">100 Facts. 10,000 Words. Endless Wonder.</div>
</header>

<main>
  <div class="spotlight-label">✦ &nbsp; Latest Release &nbsp; ✦</div>

  <!-- SPOTLIGHT — updated by n8n via books.json -->
  <div class="spotlight" id="spotlight">
    <div class="spotlight-cover">
      <img id="spotlight-cover" src="" alt="">
      <div class="new-badge">NEW</div>
    </div>
    <div class="spotlight-info">
      <div class="spotlight-category" id="spotlight-category"></div>
      <div class="spotlight-title" id="spotlight-title"></div>
      <div class="spotlight-subtitle" id="spotlight-subtitle"></div>
      <div class="spotlight-desc" id="spotlight-desc"></div>
      <a class="btn-amazon" id="spotlight-link" href="#" target="_blank">Read on Amazon Kindle →</a>
    </div>
  </div>

  <div class="gold-rule"></div>

  <div class="grid-label">✦ &nbsp; The Full Collection &nbsp; ✦</div>

  <!-- GRID — populated from books.json -->
  <div class="books-grid" id="books-grid"></div>
</main>

<footer>
  <div class="footer-name">The Factology Guru™</div>
  <div class="footer-desc">Weird, wild & wonderful facts about the most fascinating subjects on Earth — and beyond. 100 facts per book. No filler. Pure discovery.</div>
</footer>

<script>
  fetch('books.json')
    .then(r => r.json())
    .then(data => {
      // Spotlight
      const s = data.spotlight;
      document.getElementById('spotlight-cover').src = s.cover;
      document.getElementById('spotlight-cover').alt = s.title;
      document.getElementById('spotlight-category').textContent = s.category;
      document.getElementById('spotlight-title').textContent = s.title;
      document.getElementById('spotlight-subtitle').textContent = s.subtitle;
      document.getElementById('spotlight-desc').textContent = s.description;
      document.getElementById('spotlight-link').href = s.amazon_url;

      // Grid
      const grid = document.getElementById('books-grid');
      if (!data.books || data.books.length === 0) {
        grid.innerHTML = '<div class="empty-grid">More titles coming soon...</div>';
        return;
      }
      data.books.forEach(book => {
        const a = document.createElement('a');
        a.className = 'book-card';
        a.href = book.amazon_url;
        a.target = '_blank';
        a.innerHTML = `
          <img src="${book.cover}" alt="${book.title}">
          <div class="book-card-info">
            <div class="book-card-title">${book.title}</div>
            <div class="book-card-cat">${book.category}</div>
          </div>`;
        grid.appendChild(a);
      });
    })
    .catch(() => {
      document.getElementById('spotlight-title').textContent = 'Coming Soon';
      document.getElementById('spotlight-desc').textContent = 'Our first titles are on their way.';
    });
</script>
</body>
</html>
